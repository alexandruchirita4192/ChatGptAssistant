<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>Ionic ChatGPT Assistant</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">Ionic ChatGPT Assistant</ion-title>
    </ion-toolbar>
  </ion-header>
  <div id="container" style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);">
    <ion-grid style="width: 800px; height: 600px; overflow: scroll;">
      <ion-row style="user-select: none;">
        <ion-col size="3">&nbsp;</ion-col>
        <ion-col size="3">&nbsp;</ion-col>
        <ion-col size="3">&nbsp;</ion-col>
      </ion-row>
      <ion-row>
        <ion-col>
          <ion-textarea [(ngModel)]="text" label="User input text:"
            placeholder="Click here to type user input text"></ion-textarea>
          <ion-select label="Request type:" placeholder="Select request type" [(ngModel)]="selectedKey"
            interface="alert">
            <ion-select-option *ngFor="let key of keys" [value]="key">
              {{key.toString().split('_').join(' ')}}
            </ion-select-option>
          </ion-select>
          <ion-button expand="full" (click)="submitText()">Submit</ion-button>
          <ion-textarea label="Template:" [(ngModel)]="responseTemplate"
            placeholder="Template used for the request of selected type will be filled here"
            [readonly]="true"></ion-textarea>
          <ion-textarea [(ngModel)]="responseText" label="ChatGPT response:"
            placeholder="ChatGPT response will be filled here"></ion-textarea>
        </ion-col>
      </ion-row>
      <ion-row style="user-select: none;">
        <ion-col size="3">&nbsp;</ion-col>
        <ion-col size="3">&nbsp;</ion-col>
        <ion-col size="3">&nbsp;</ion-col>
      </ion-row>
      <ion-row>
        <ion-card>
          <ion-card-title style="border: 3px dashed #1c87c9;">History</ion-card-title>
          <ion-list>
            <table style="text-align: start; border: 3px dashed #1c87c9;">
              <tr style="border: 3px dashed #1c87c9;">
                <th style="border: 3px dashed #1c87c9;">Request type</th>
                <th style="border: 3px dashed #1c87c9;">User input text</th>
                <th style="border: 3px dashed #1c87c9;">ChatGPT response</th>
              </tr>
              <tr *ngFor="let item of history" style="border: 3px dashed #1c87c9;">
                <td style="vertical-align: top; border: 3px dashed #1c87c9;">
                  <div>
                    <b>Type:</b>
                    <pre style="text-wrap: wrap;">{{item.key.toString().split('_').join(' ')}}</pre>
                  </div>
                  <div>
                    <b>Template:</b>
                    <pre style="text-wrap: wrap;">{{item.template}}</pre>
                  </div>
                </td>
                <td style="vertical-align: top; border: 3px dashed #1c87c9;">
                  <pre style="text-wrap: wrap;">{{item.text}}</pre>
                </td>
                <td style="vertical-align: top; border: 3px dashed #1c87c9;">
                  <pre style="text-wrap: wrap;">{{item.value}}</pre>
                </td>
              </tr>
            </table>
          </ion-list>
        </ion-card>
        <ion-col size="3">&nbsp;</ion-col>
      </ion-row>
      <ion-row>
        <ion-col size="3">&nbsp;</ion-col>
        <ion-col size="3">&nbsp;</ion-col>
        <ion-col size="3">&nbsp;</ion-col>
      </ion-row>
    </ion-grid>
  </div>
</ion-content>
