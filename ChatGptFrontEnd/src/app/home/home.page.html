<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>Ionic ChatGPT Assistant</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">Ionic ChatGPT Assistant</ion-title>
    </ion-toolbar>
  </ion-header>

  <div id="container" style="display: flex; justify-content: center; align-items: center; height: 100%;">
    <ion-grid [fixed]="true">
      <ion-row>
        <ion-col size="3">&nbsp;</ion-col>
        <ion-col size="3">&nbsp;</ion-col>
        <ion-col size="3">&nbsp;</ion-col>
      </ion-row>
      <ion-row>
        <ion-col size="3">&nbsp;</ion-col>
        <ion-col size="auto">
          <ion-label>Enter your text:</ion-label>
          <ion-textarea [(ngModel)]="text"></ion-textarea>
          <ion-select [(ngModel)]="selectedKey" interface="alert">
            <ion-select-option *ngFor="let key of keys" [value]="key">
              {{key.toString().split('_').join(' ')}}
            </ion-select-option>
          </ion-select>
          <ion-button expand="full" (click)="submitText()">Submit</ion-button>
          <ion-label>Response from ChatGPT:</ion-label>
          <ion-textarea [(ngModel)]="responseText"></ion-textarea>
        </ion-col>
        <ion-col size="3">&nbsp;</ion-col>
      </ion-row>
      <ion-row>
        <ion-col size="3">&nbsp;</ion-col>
        <ion-col size="3">&nbsp;</ion-col>
        <ion-col size="3">&nbsp;</ion-col>
      </ion-row>
    </ion-grid>
  </div>
</ion-content>
