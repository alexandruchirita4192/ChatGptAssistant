name: Build/release

on: push

jobs:
  release:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v1

      - name: Install Node.js, NPM and Yarn
        uses: actions/setup-node@v1
        with:
          node-version: 24.x
          
      - name: Setup java
        uses: actions/setup-java@v1
        with:
          java-version: 1.8
          
      - name: Install Ionic
        run: npm install -g @ionic/cli

      - name: Install app dependencies (using `--legacy-peer-deps` to install without downgrading due to other constraints)
        working-directory: "ChatGptFrontEnd"
        run: npm install --legacy-peer-deps
        
      - name: Upgrade Angular Version to Version 19 & install dependencies without downgrading & commit & push changes that made it work
        working-directory: "ChatGptFrontEnd"
        run: ng update @angular/core@19 @angular/cli@19 && npm install --legacy-peer-deps && git commit && git push

      - name: Build Ionic App
        working-directory: "ChatGptFrontEnd"
        run: ionic build --prod

      - name: Install Electron Packager Globally
        working-directory: "ChatGptFrontEnd"
        run: npm install -g electron-builder
      
      - name: Build/release Electron app
        uses: samuelmeuli/action-electron-builder@v1
        with:
          # GitHub token, automatically provided to the action
          # (No need to define this secret in the repo settings)
          github_token: ${{ secrets.github_token }}

          # If the commit is tagged with a version (e.g. "v1.0.0"),
          # release the app after building
          release: ${{ startsWith(github.ref, 'refs/tags/v') }}

          # Path where to run the npm commands
          package_root: "ChatGptFrontEnd"
